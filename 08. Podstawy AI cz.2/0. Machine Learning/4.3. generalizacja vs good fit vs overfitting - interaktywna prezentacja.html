<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niedouczenie, generalizacja, przeuczenie – symulacja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#16202E; --ink-2:#4A5668; --ink-3:#7C8797;
  --rule:#D9DEE6; --grid:#E9EDF2;
  --train:#1F5FCC; --test:#D67A00; --model:#16202E; --truth:#8A94A3;
  --zone-under:#FFF1D6; --zone-good:#DDF1E6; --zone-over:#FBE0DE; --zone-mid:#EEF0F3;
  --zone-under-ink:#6B4500; --zone-good-ink:#1C5B3A; --zone-over-ink:#7A2320; --zone-mid-ink:#3F4A5A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --panel:#171E28; --ink:#E7ECF3; --ink-2:#AAB4C3; --ink-3:#7D8898;
    --rule:#2A3442; --grid:#1F2833;
    --train:#6FA3FF; --test:#FFB04A; --model:#F2F5F9; --truth:#8792A3;
    --zone-under:#3A2C10; --zone-good:#133126; --zone-over:#3A1715; --zone-mid:#222B37;
    --zone-under-ink:#FFD58A; --zone-good-ink:#9FE0BC; --zone-over-ink:#FFB3AE; --zone-mid-ink:#C8D1DD;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --panel:#171E28; --ink:#E7ECF3; --ink-2:#AAB4C3; --ink-3:#7D8898;
  --rule:#2A3442; --grid:#1F2833;
  --train:#6FA3FF; --test:#FFB04A; --model:#F2F5F9; --truth:#8792A3;
  --zone-under:#3A2C10; --zone-good:#133126; --zone-over:#3A1715; --zone-mid:#222B37;
  --zone-under-ink:#FFD58A; --zone-good-ink:#9FE0BC; --zone-over-ink:#FFB3AE; --zone-mid-ink:#C8D1DD;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.6}
main{max-width:1080px;margin:0 auto;padding:2rem 1.25rem 3rem}
h1{font-family:"Literata",Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.15;margin:0 0 .5rem;letter-spacing:-.01em}
.lead{color:var(--ink-2);max-width:68ch;margin:0 0 1.75rem}
h2{font-family:"Literata",Georgia,serif;font-weight:500;font-size:1.3rem;margin:0 0 .6rem}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:1.25rem}
.controls{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center}
.controls label{font-weight:700}
.deg{font-family:"Literata",Georgia,serif;font-size:2rem;font-weight:700;min-width:2ch;text-align:center;line-height:1}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
button{font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:.45rem 1rem;cursor:pointer}
button:hover{background:var(--grid)}
button:focus-visible,input:focus-visible{outline:3px solid var(--train);outline-offset:3px}
.zones{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:.9rem}
.cell{height:14px;border-radius:3px;border:2px solid transparent}
.cell.active{border-color:var(--ink)}
.zone-labels{display:grid;grid-template-columns:2fr 3fr 2fr 4fr;gap:4px;margin-top:6px;font-size:.8rem;color:var(--ink-2)}
.zone-labels span{text-align:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1rem;margin-top:1rem}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}.controls{grid-template-columns:auto 1fr auto}.controls button{grid-column:1/-1;justify-self:start}}
canvas{width:100%;display:block}
#fit{height:340px} #err{height:260px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--ink-2);margin-top:.6rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.8rem}
.stat{border:1px solid var(--rule);border-radius:10px;padding:.6rem .8rem}
.stat .k{font-size:.82rem;color:var(--ink-2)}
.stat .v{font-family:"Literata",Georgia,serif;font-size:1.6rem;font-weight:700;line-height:1.2}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main>

<section class="panel" aria-label="Sterowanie">
  <div class="controls">
    <label for="deg">Stopień wielomianu</label>
    <input type="range" id="deg" min="1" max="11" step="1" value="1">
    <output id="degOut" class="deg" for="deg">1</output>
    <button id="newData" type="button">Wylosuj nowe dane</button>
  </div>
  <div class="zones" id="zones" aria-hidden="true"></div>
  <div class="zone-labels" aria-hidden="true"><span>niedouczenie</span><span>dobra generalizacja</span><span>przejście</span><span>przeuczenie</span></div>
</section>

<div class="grid2">
  <section class="panel" aria-label="Dopasowanie modelu do danych">
    <h2>Co widzi model</h2>
    <canvas id="fit" role="img" aria-label="Wykres punktów treningowych, testowych i krzywej modelu"></canvas>
    <div class="legend">
      <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="var(--train)"/></svg>trening (pełne kółka)</span>
      <span><svg width="16" height="14" aria-hidden="true"><path d="M8 1.5 L14.5 12.5 L1.5 12.5 Z" fill="none" stroke="var(--test)" stroke-width="2.2"/></svg>test (puste trójkąty)</span>
      <span><svg width="28" height="10" aria-hidden="true"><line x1="1" y1="5" x2="27" y2="5" stroke="var(--model)" stroke-width="3.5"/></svg>model (gruba ciągła)</span>
      <span><svg width="28" height="10" aria-hidden="true"><line x1="1" y1="5" x2="27" y2="5" stroke="var(--truth)" stroke-width="2" stroke-dasharray="6 4"/></svg>prawdziwa zależność (przerywana)</span>
    </div>
  </section>
  <section class="panel" aria-label="Błąd w zależności od złożoności">
    <h2>Błąd a złożoność</h2>
    <div class="stats">
      <div class="stat"><div class="k">Błąd na treningu</div><div class="v" id="trErr">–</div></div>
      <div class="stat"><div class="k">Błąd na teście</div><div class="v" id="teErr">–</div></div>
    </div>
    <canvas id="err" role="img" aria-label="Wykres błędu treningowego i testowego dla stopni od 1 do 11"></canvas>
    <div class="legend">
      <span><svg width="30" height="12" aria-hidden="true"><line x1="1" y1="6" x2="29" y2="6" stroke="var(--train)" stroke-width="2.5"/><circle cx="15" cy="6" r="4" fill="var(--train)"/></svg>trening (ciągła, kółka)</span>
      <span><svg width="30" height="12" aria-hidden="true"><line x1="1" y1="6" x2="29" y2="6" stroke="var(--test)" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M15 1.5 L19.5 10.5 L10.5 10.5 Z" fill="none" stroke="var(--test)" stroke-width="2"/></svg>test (przerywana, trójkąty)</span>
    </div>
  </section>
</div>

</main>

<script>
(function(){
const $=id=>document.getElementById(id);
const N=12,NOISE=0.25,MAXD=11;
const f=x=>Math.sin(Math.PI*x);
const ZONES=[null,'under','under','good','good','good','mid','mid','over','over','over','over'];
let train=[],test=[],models=[],trE=[],teE=[];

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function sample(n){const a=[];for(let i=0;i<n;i++){const x=-0.97+1.94*(i+Math.random())/n;a.push({x,y:f(x)+NOISE*gauss()});}return a;}
function basis(x,d){const t=[1,x];for(let k=2;k<=d;k++)t.push(2*x*t[k-1]-t[k-2]);return t.slice(0,d+1);}
function evalP(w,x){const t=basis(x,w.length-1);let s=0;for(let i=0;i<w.length;i++)s+=w[i]*t[i];return s;}
function fit(pts,d){
  const m=d+1,A=[],b=Array(m).fill(0);
  for(let i=0;i<m;i++)A.push(Array(m).fill(0));
  for(const p of pts){const t=basis(p.x,d);for(let i=0;i<m;i++){b[i]+=t[i]*p.y;for(let j=0;j<m;j++)A[i][j]+=t[i]*t[j];}}
  for(let i=0;i<m;i++)A[i][i]+=1e-10;
  for(let c=0;c<m;c++){
    let pv=c;for(let r=c+1;r<m;r++)if(Math.abs(A[r][c])>Math.abs(A[pv][c]))pv=r;
    [A[c],A[pv]]=[A[pv],A[c]];[b[c],b[pv]]=[b[pv],b[c]];
    for(let r=c+1;r<m;r++){const k=A[r][c]/A[c][c];for(let j=c;j<m;j++)A[r][j]-=k*A[c][j];b[r]-=k*b[c];}
  }
  const w=Array(m).fill(0);
  for(let i=m-1;i>=0;i--){let s=b[i];for(let j=i+1;j<m;j++)s-=A[i][j]*w[j];w[i]=s/A[i][i];}
  return w;
}
function mse(w,pts){let s=0;for(const p of pts){const e=evalP(w,p.x)-p.y;s+=e*e;}return s/pts.length;}
function regen(){train=sample(N);test=sample(N);models=[];trE=[];teE=[];
  for(let d=1;d<=MAXD;d++){const w=fit(train,d);models[d]=w;trE[d]=mse(w,train);teE[d]=mse(w,test);}}

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}
function setup(c){const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return {ctx,w,h};}
function tri(ctx,x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*0.9,y+r*0.7);ctx.lineTo(x-r*0.9,y+r*0.7);ctx.closePath();}

function drawFit(d){
  const {ctx,w,h}=setup($('fit'));const P=14;
  const X=x=>P+(x+1)/2*(w-2*P),Y=y=>h/2-y/2.2*(h/2-P);
  ctx.strokeStyle=css('--grid');ctx.lineWidth=1;
  for(let gx=-1;gx<=1.001;gx+=0.25){ctx.beginPath();ctx.moveTo(X(gx),P);ctx.lineTo(X(gx),h-P);ctx.stroke();}
  for(let gy=-2;gy<=2.001;gy+=0.5){ctx.beginPath();ctx.moveTo(P,Y(gy));ctx.lineTo(w-P,Y(gy));ctx.stroke();}
  ctx.strokeStyle=css('--rule');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P,Y(0));ctx.lineTo(w-P,Y(0));ctx.stroke();
  ctx.save();ctx.beginPath();ctx.rect(0,P-4,w,h-2*P+8);ctx.clip();
  ctx.setLineDash([7,5]);ctx.strokeStyle=css('--truth');ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=200;i++){const x=-1+2*i/200;i?ctx.lineTo(X(x),Y(f(x))):ctx.moveTo(X(x),Y(f(x)));}
  ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=css('--model');ctx.lineWidth=3.5;ctx.lineJoin='round';ctx.beginPath();
  for(let i=0;i<=500;i++){const x=-1+2*i/500;const y=Math.max(-5,Math.min(5,evalP(models[d],x)));i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y));}
  ctx.stroke();ctx.restore();
  ctx.fillStyle=css('--train');for(const p of train){ctx.beginPath();ctx.arc(X(p.x),Y(p.y),5.5,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle=css('--test');ctx.lineWidth=2.2;for(const p of test){tri(ctx,X(p.x),Y(p.y),7);ctx.stroke();}
}

function drawErr(d){
  const {ctx,w,h}=setup($('err'));const L=40,R=14,T=12,B=34;
  const cap=Math.max(trE[1],teE[1])*1.8;
  const X=k=>L+(k-1)/(MAXD-1)*(w-L-R),Y=v=>T+(1-Math.min(v,cap)/cap)*(h-T-B);
  ctx.strokeStyle=css('--grid');ctx.lineWidth=1;
  for(let i=1;i<=4;i++){const y=T+(h-T-B)*i/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();}
  ctx.strokeStyle=css('--rule');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,h-B);ctx.lineTo(w-R,h-B);ctx.stroke();
  ctx.fillStyle=css('--ink-2');ctx.font='13px "Atkinson Hyperlegible", system-ui, sans-serif';ctx.textAlign='center';
  for(let k=1;k<=MAXD;k++)ctx.fillText(k,X(k),h-B+18);
  ctx.fillText('stopień wielomianu',(L+w-R)/2,h-2);
  ctx.save();ctx.translate(14,(h-B+T)/2);ctx.rotate(-Math.PI/2);ctx.fillText('błąd',0,0);ctx.restore();
  ctx.strokeStyle=css('--ink-3');ctx.setLineDash([3,4]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(d),T);ctx.lineTo(X(d),h-B);ctx.stroke();ctx.setLineDash([]);
  const tr=css('--train'),te=css('--test');
  ctx.strokeStyle=tr;ctx.lineWidth=2.5;ctx.beginPath();
  for(let k=1;k<=MAXD;k++)k>1?ctx.lineTo(X(k),Y(trE[k])):ctx.moveTo(X(k),Y(trE[k]));ctx.stroke();
  ctx.fillStyle=tr;for(let k=1;k<=MAXD;k++){ctx.beginPath();ctx.arc(X(k),Y(trE[k]),k===d?7:4,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle=te;ctx.setLineDash([6,4]);ctx.beginPath();
  for(let k=1;k<=MAXD;k++)k>1?ctx.lineTo(X(k),Y(teE[k])):ctx.moveTo(X(k),Y(teE[k]));ctx.stroke();ctx.setLineDash([]);
  ctx.lineWidth=2.2;for(let k=1;k<=MAXD;k++){tri(ctx,X(k),Y(teE[k]),k===d?9:6);ctx.stroke();}
}

function zoneVars(z){return {under:['--zone-under','--zone-under-ink'],good:['--zone-good','--zone-good-ink'],mid:['--zone-mid','--zone-mid-ink'],over:['--zone-over','--zone-over-ink']}[z];}

function buildZones(){const box=$('zones');box.innerHTML='';
  for(let k=1;k<=MAXD;k++){const c=document.createElement('div');c.className='cell';const v=zoneVars(ZONES[k]);c.style.background='var('+v[0]+')';c.dataset.k=k;box.appendChild(c);}}

function fmt(v){return v>99?'>99':v.toFixed(3);}
function render(){
  const d=+$('deg').value;$('degOut').textContent=d;
  $('trErr').textContent=fmt(trE[d]);$('teErr').textContent=fmt(teE[d]);
  document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('active',+c.dataset.k===d));
  drawFit(d);drawErr(d);
}
$('deg').addEventListener('input',render);
$('newData').addEventListener('click',()=>{regen();render();});
window.addEventListener('resize',render);
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);}catch(e){}
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
buildZones();regen();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
})();
</script>
</body>
</html>
