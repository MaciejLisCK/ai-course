<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlisty DBSCAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Układ: trzy kolumny — zbiór danych | dwie ścieżki (uczenie, inferencja) + kontrolki | biblioteka modeli. Programy to "urządzenia" z gniazdem na model DBSCAN. */
:root{
  --bg:#E6E9EE; --panel:#F8F9FB; --well:#DCE0E7; --ink:#14181E; --muted:#56606E; --line:#C8CED7;
  --accent:#3A41D4; --accent-soft:rgba(58,65,212,.13); --glyph-stroke:#14181E; --shadow:rgba(20,24,30,.22);
  --c1:#E69F00; --c2:#56B4E9; --c3:#009E73; --c4:#F0E442; --c5:#0072B2; --c6:#D55E00; --c7:#CC79A7; --c8:#3B3B3B;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1014; --panel:#161A20; --well:#0A0C10; --ink:#E7EBF1; --muted:#8C96A4; --line:#2A313B;
  --accent:#9095FF; --accent-soft:rgba(144,149,255,.17); --glyph-stroke:#0A0C10; --shadow:rgba(0,0,0,.55); --c8:#D8D8D8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1014; --panel:#161A20; --well:#0A0C10; --ink:#E7EBF1; --muted:#8C96A4; --line:#2A313B;
  --accent:#9095FF; --accent-soft:rgba(144,149,255,.17); --glyph-stroke:#0A0C10; --shadow:rgba(0,0,0,.55); --c8:#D8D8D8; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:clamp(280px,22vw,370px) minmax(0,1fr) clamp(222px,16vw,272px);gap:12px;padding-block:12px;padding-inline:16px}
.comp{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.comp>header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none;min-height:40px}
h2{font:600 12.5px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;margin:0;white-space:nowrap}
h3{font:600 11px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
.count{font:500 11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.gl{display:inline-block;vertical-align:-2px;flex:none}

/* przyciski */
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;white-space:nowrap;line-height:1.1}
.btn:hover{background:var(--well)}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:6px 9px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tg{display:inline-flex;align-items:center;gap:6px}
.tg::before{content:"";width:10px;height:10px;border:1.5px solid currentColor;border-radius:2px;flex:none}
.tg[aria-pressed="true"]::before{background:currentColor;box-shadow:inset 0 0 0 1.5px var(--panel)}
.tg[aria-pressed="true"]{border-color:var(--ink)}

/* zbiór danych */
.tbl-wrap{overflow:auto;flex:1;min-height:0}
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{position:sticky;top:0;background:var(--panel);z-index:1;font:600 10.5px var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
.dt th.l{text-align:left}
.dt td{padding:2px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);height:27px}
.dt tr{cursor:grab}
.dt tbody tr:hover td{background:color-mix(in srgb,var(--well) 70%,transparent)}
.dt tr.sel td{background:var(--accent-soft)}
.dt .grip{width:18px;color:var(--muted);text-align:center;padding:0 2px;touch-action:none;user-select:none;font-size:13px}
th.grip{cursor:grab;color:var(--ink)!important;font-size:14px!important}
.dt .ck{width:22px;padding:0 2px;text-align:center}
.dt .tt{max-width:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.dt .tt input{width:100%;border:1px solid var(--accent);border-radius:4px;background:var(--panel);padding:2px 4px}
.dt td.n{text-align:right;width:52px}
.num{width:4.4ch;font:500 12px var(--f-mono);text-align:right;background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 3px;font-variant-numeric:tabular-nums}
.num:hover{border-color:var(--line)}
.num:focus{border-color:var(--accent);background:var(--panel);outline:none}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num{-moz-appearance:textfield;appearance:textfield}
.dt td.kc{width:34px;text-align:center;font:700 11px var(--f-mono);white-space:nowrap}
.dt tr.in-train td.grip{color:var(--ink);font-weight:700}
.dt tr.in-train td.grip::after{content:"";display:block;height:0}
.mk{display:inline-block;width:7px;height:7px;border:1.5px solid var(--ink);border-radius:50%;vertical-align:1px}
.kc b{margin-left:2px}
input[type=checkbox]{accent-color:var(--ink);width:14px;height:14px;cursor:pointer;margin:0;vertical-align:-2px}
.comp>footer{border-top:1px solid var(--line);padding:7px 10px;display:flex;gap:8px;align-items:center;flex:none}

/* środek */
.center{display:grid;grid-template-rows:minmax(0,1.12fr) minmax(0,1fr) auto;gap:12px;min-height:0;min-width:0}
.lane{display:grid;min-height:0;min-width:0}
.lane.train{grid-template-columns:172px 26px minmax(0,1fr)}
.lane.infer{grid-template-columns:152px 26px minmax(226px,244px) 26px minmax(0,1fr)}
.flow{display:grid;place-items:center;color:var(--muted)}
.flow svg{width:22px;height:40px;overflow:visible}
.flow path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.flow.on{color:var(--ink)}
.flow.on path.ln{stroke-dasharray:4 4;animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-8}}

/* dane uczące */
.drop-empty{flex:1;display:grid;place-items:center;color:var(--line);padding:10px}
.drop-empty svg{width:56px;height:56px}
.td-big{font:700 30px/1 var(--f-display);padding:12px 12px 2px;font-variant-numeric:tabular-nums}
.td-big small{font:500 12px var(--f-mono);color:var(--muted);margin-left:4px}
.td-list{flex:1;min-height:0;overflow:auto;padding:6px 8px 10px;display:flex;flex-direction:column;gap:3px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 6px;border-radius:6px;background:var(--well);font-size:12px;min-height:24px}
.chip .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .k{width:28px;font:700 10.5px var(--f-mono);display:inline-flex;align-items:center;gap:2px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:2px 5px;border-radius:4px}
.chip button:hover{background:var(--panel);color:var(--ink)}

/* program */
.program{background:var(--well);border:1.5px solid var(--ink)}
.program>header{border-bottom-color:color-mix(in srgb,var(--ink) 30%,transparent);background:var(--panel)}
.led{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.program.busy .led{background:var(--ink);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:transparent}}
.phases{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.phases span{font:500 10.5px var(--f-mono);padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
.phases span.next{border:1.5px dashed var(--ink);color:var(--ink)}
.phases span.on{background:var(--ink);border:1.5px solid var(--ink);color:var(--panel)}
.prog-body{flex:1;min-height:0;display:grid;gap:10px;padding:10px}
.prog-body.tr{grid-template-columns:232px minmax(0,1fr)}
.prog-body.inf{grid-template-rows:auto minmax(0,1fr)}
.slot{border:1.5px dashed color-mix(in srgb,var(--muted) 70%,transparent);border-radius:11px;padding:5px;min-height:0;overflow:auto;display:flex;flex-direction:column}
.slot.full{border-style:solid;border-color:transparent;padding:0}
.slot-empty{flex:1;display:grid;place-items:center;color:var(--muted);min-height:90px}
.slot-empty svg{width:64px;height:64px;opacity:.55}
.viz{position:relative;min-height:0;min-width:0;border-radius:9px;background:var(--panel);overflow:hidden;border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr)}
.cvwrap{position:relative;min-height:0}
.viz canvas{position:absolute;inset:0;cursor:grab;touch-action:none}
.viz canvas:active{cursor:grabbing}
.readout{font:500 11px var(--f-mono);color:var(--muted);padding:6px 9px;min-height:27px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink);font-weight:700}
.readout .warn{color:var(--ink);font-weight:700}
.inload{min-height:34px;border-radius:8px;border:1.5px dashed color-mix(in srgb,var(--muted) 70%,transparent);display:flex;align-items:center;gap:8px;padding:5px 9px;font:500 11.5px var(--f-mono);color:var(--muted)}
.inload.full{border-style:solid;border-color:var(--ink);background:var(--panel);color:var(--ink)}
.inload .tt{font-family:var(--f-body);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.program.pulse .slot .mcard{animation:pulse .55s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 10px transparent}}

/* karta modelu */
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 9px 7px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.slot .mcard{border:1.5px solid var(--ink)}
.mcard:hover{border-color:var(--ink)}
.mc-head{display:flex;align-items:center;gap:7px}
.mc-letter{width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:700 14px var(--f-display)}
.mc-name{font:600 14px var(--f-display);flex:1;min-width:0}
.mc-k{font:700 12px var(--f-mono);padding:2px 6px;border:1px solid var(--ink);border-radius:5px}
.mc-meta{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 5px;font:500 10.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.mc-st{color:var(--ink);font-weight:700}
.mc-tab{width:100%;border-collapse:collapse;font:500 11px var(--f-mono);font-variant-numeric:tabular-nums}
.mc-tab th{font:600 9.5px var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:2px 4px 3px;border-bottom:1px solid var(--line)}
.mc-tab td{text-align:right;padding:1px 4px;height:17px;background:linear-gradient(to right,var(--accent-soft) var(--p),transparent var(--p));background-clip:content-box}
.mc-tab td.gi{text-align:left;background:none;white-space:nowrap;width:34px;font-weight:700}
.mc-tab tr+tr td{border-top:1px solid transparent}
.st-untrained .mc-tab td:not(.gi){color:var(--muted)}

/* biblioteka */
.lib-list{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.newm{margin-left:auto;flex-wrap:nowrap;display:flex;align-items:center;gap:4px}
.kstep{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.kstep button{border:0;background:var(--panel);width:24px;height:26px;cursor:pointer;font-weight:700}
.kstep button:hover{background:var(--well)}
.kstep span{font:700 11.5px var(--f-mono);min-width:38px;text-align:center}

/* dana wejściowa */
.token{display:flex;align-items:center;gap:8px;margin:10px 10px 4px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 0 var(--ink)}
.token .gr{font-size:14px}
.token .tx{min-width:0;flex:1}
.token .tt{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.token small{display:block;font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.fields{padding:6px 10px 10px;display:flex;flex-direction:column;gap:9px;overflow:auto;min-height:0}
.fields .ti{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--panel);font-size:12.5px}
.fld{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center}
.fld label{font:600 10.5px var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ink);margin:0}
.fld .num{border-color:var(--line);width:5ch}

/* wynik */
.res-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 162px;gap:8px;padding:8px}
.viz.solo{grid-template-rows:minmax(0,1fr)}
.res{min-height:0;overflow:auto;padding:2px 2px 4px}
.res-empty{height:100%;display:grid;place-items:center;color:var(--line);font:700 40px var(--f-display)}
.res-msg{height:100%;display:grid;place-items:center;font:700 14px var(--f-display);color:var(--muted)}
.res-top{display:flex;align-items:center;gap:9px}
.res-top .big{width:42px;height:42px;border-radius:12px;background:var(--well);display:grid;place-items:center;flex:none}
.res-k{font:700 19px/1.05 var(--f-display)}
.res-sub{font:500 11px var(--f-mono);color:var(--muted);margin-top:3px}
.bars{display:flex;flex-direction:column;gap:3px}
.bar{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:6px;font:500 11px var(--f-mono);font-variant-numeric:tabular-nums}
.bar .tr{height:9px;border-radius:3px;background:var(--well);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--muted);border-radius:3px}
.bar.best{font-weight:700}
.bar.best .tr i{background:var(--ink)}
.bar.best .v::after{content:" ◀"}
.bar .v{text-align:right;white-space:nowrap}
.pl{display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none}
.pl li{display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:center;padding:4px 6px;border-radius:6px;background:var(--well);font-size:12.5px}
.pl li .tt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.pl li small{font:500 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.pl li.now{background:var(--ink);color:var(--panel)}
.pl li.now small{color:color-mix(in srgb,var(--panel) 70%,transparent)}
.play{width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:4px}

/* kontrolki */
.controls{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:10px 14px}
.controls>h2{margin-right:2px}
.cg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cg-l{font:600 10.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.cg select{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:5px 6px;font-weight:700;font-size:12px}
.cg input[type=range]{width:84px;accent-color:var(--ink)}
.spd{font:700 11px var(--f-mono);min-width:3.6ch}

/* przeciąganie */
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;box-shadow:0 22px 44px var(--shadow);margin:0!important}
.ghost.mcard{border:1.5px solid var(--ink)}
.rowghost{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--panel);border:1.5px solid var(--ink);font-size:12.5px;max-width:260px;box-shadow:4px 4px 0 -1px var(--panel),4px 4px 0 0 var(--ink),8px 8px 0 -1px var(--panel),8px 8px 0 0 var(--ink),0 20px 40px var(--shadow)}
.rowghost.one{box-shadow:0 20px 40px var(--shadow)}
.rowghost b{font:700 15px var(--f-display)}
.rowghost span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lifted{opacity:.3;outline:1.5px dashed var(--muted);outline-offset:-1px}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.can-drop{outline:2px dashed var(--accent);outline-offset:-4px}
.over{outline:3px solid var(--accent)!important;outline-offset:-4px;}
.over.comp,.over.slot,.over.lib-list{background-image:linear-gradient(var(--accent-soft),var(--accent-soft))}
.landed{animation:land .45s ease-out}
@keyframes land{0%{transform:scale(.985)}60%{transform:scale(1.008)}100%{transform:none}}
.nudge{animation:nudge .4s}
@keyframes nudge{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

@media (max-width:1260px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr)}
  #cData{height:440px}
  #cLib{height:auto;max-height:640px}
  .center{grid-template-rows:auto}
  .lane.train,.lane.infer{grid-template-columns:minmax(0,1fr)}
  .flow{height:28px}
  .flow svg{transform:rotate(90deg)}
  .lane .comp{min-height:150px}
  .prog-body.tr{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 340px}
  #cTrainData{max-height:260px}
  #cResult{min-height:260px}
  .res-grid{grid-template-columns:minmax(0,1fr)}
  .res-grid .viz{height:300px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* DBSCAN — dodatki */
.mc-par{display:flex;gap:4px}
.mc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-par span{font:700 10.5px var(--f-mono);padding:1px 5px;border:1px solid var(--ink);border-radius:5px;white-space:nowrap}
.mc-tab td.c{background:none}
.mc-tab tr.noise td{color:var(--muted);border-top:1px dashed var(--line)}
.mc-tab tr.more td{color:var(--muted);text-align:left}
.lib-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lib-foot .cg-l{margin-right:0}
.kstep span{min-width:44px}
.legend{margin-left:auto;display:flex;gap:10px;align-items:center}
.legend span{display:inline-flex;gap:4px;align-items:center}
.bar .tr{position:relative;overflow:visible}
.bar .tr .eps{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--ink)}
.bar.in .tr i{background:var(--ink)}
.bar.best .v::after{content:" ◀"}
.res-k.noise{color:var(--muted)}
.bars-l{display:flex;justify-content:space-between;font:500 10px var(--f-mono);color:var(--muted);margin:-3px 0 5px 40px}
</style>

</head>
<body>
<div class="app">
  <!-- ZBIÓR DANYCH -->
  <section class="comp" id="cData">
    <header><h2>Zbiór danych</h2><span class="count" id="dataCount"></span></header>
    <div class="tbl-wrap">
      <table class="dt">
        <thead><tr>
          <th class="grip" data-drag="rows" data-all="1" title="Przeciągnij cały zbiór">⠿</th>
          <th class="ck"><input type="checkbox" id="selAll" aria-label="Zaznacz wszystkie"></th>
          <th class="l">Tytuł</th><th>Wiek</th><th>Bas</th><th>Sł/min</th><th>K</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

<script>
(()=>{
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- cechy ---------- */
const FEAT=[
  {key:'age', label:'wiek',   min:0, max:80},

/* ---------- RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ---------- kształty klastrów (forma + kolor + numer) ---------- */
const f3=n=>n.toFixed(3);
function poly(n,r,rot){let d='';for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;d+=(i?'L':'M')+f3(r*Math.cos(a))+' '+f3(r*Math.sin(a))}return d+'Z'}
function star(n,r1,r2,rot){let d='';for(let i=0;i<2*n;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;d+=(i?'L':'M')+f3(r*Math.cos(a))+' '+f3(r*Math.sin(a))}return d+'Z'}
const PLUS=[[-.36,-1],[.36,-1],[.36,-.36],[1,-.36],[1,.36],[.36,.36],[.36,1],[-.36,1],[-.36,.36],[-1,.36],[-1,-.36],[-.36,-.36]];
function ptsPath(P,rot,sc){const c=Math.cos(rot),s=Math.sin(rot);return P.map(([x,y],i)=>(i?'L':'M')+f3((x*c-y*s)*sc)+' '+f3((x*s+y*c)*sc)).join('')+'Z'}
const SHAPES=[
  'M1 0A1 1 0 1 1 -1 0A1 1 0 1 1 1 0Z',
  'M-0.86 -0.86H0.86V0.86H-0.86Z',
  poly(3,1.22,-Math.PI/2),
  poly(4,1.2,0),
  ptsPath(PLUS,0,1.05),
  star(5,1.28,0.54,-Math.PI/2),
  poly(6,1.05,0),
  poly(3,1.22,Math.PI/2),
  ptsPath(PLUS,Math.PI/4,1.12),
  poly(5,1.1,-Math.PI/2),
  'M-1 -0.95L0 0L-1 0.95ZM1 -0.95L0 0L1 0.95Z',
  'M-1.05 0.35A1.05 1.05 0 0 1 1.05 0.35Z'
];
const SHAPE_P2D=SHAPES.map(d=>new Path2D(d));
const NS=SHAPES.length;
const SVGB='class="gl" viewBox="-1.45 -1.45 2.9 2.9" aria-hidden="true"';
function glyph(i,s=13,border=false){
  const d=SHAPES[i%NS];
  return `<svg ${SVGB} width="${s}" height="${s}"><path d="${d}" fill="var(--c${i%8+1})" stroke="var(--glyph-stroke)" stroke-width="0.2" stroke-linejoin="round"/>${border?`<path d="${d}" transform="scale(.45)" fill="var(--panel)"/>`:''}</svg>`;
}
const noiseGlyph=(s=13)=>`<svg ${SVGB} width="${s}" height="${s}"><circle r="0.95" fill="none" stroke="var(--muted)" stroke-width="0.3"/><path d="M-0.67 0.67L0.67 -0.67" stroke="var(--muted)" stroke-width="0.3"/></svg>`;
const unvGlyph=()=>`<span class="mk"></span>`;
const gnum=(i,border)=>`${glyph(i,13,border)}<b>${i+1}</b>`;
function labGlyph(L){if(!L)return unvGlyph();if(L.c<0)return noiseGlyph();return gnum(L.c,!L.core)}

/* ---------- dane: 8 wyraźnych skupisk ---------- */
const GEN=[
 {a:8, b:22,w:85, t:["Skaczący Kangurek","Wesoła Żabka","Kolorowe Kredki","Mały Traktorek","Piosenka o Myciu Zębów","Tańczące Misie","Zielony Balonik","Kotek na Płotku","Rakieta do Księżyca","Dzień Dobry, Słonko","Pociąg Literek","Liczymy do Dziesięciu","Bąbelkowa Kąpiel"]},
 {a:17,b:90,w:165,t:["Neonowy Dym","Bez Hamulców","Ósemka","Blok 404","Zimne Łańcuchy","Nocny Tryb","Szybki Hajs","Czarny Kaptur","Ping z Osiedla","Ultrafiolet","Drip na Mrozie","Sygnał","Taśma"]},
 {a:24,b:94,w:18, t:["Pulsar","Hala 7","Stroboskop","Głęboka Woda","Orbita 128","Fala Uderzeniowa","Magnetyk","Świt w Klubie","Subwoofer","Prąd Zmienny","Rezonans","Kwadrat"]},
 {a:29,b:55,w:100,t:["Lato w Mieście","Twoje Okno","Biegnę do Ciebie","Kawa o Północy","Papierowe Serca","Kolejny Raz","Słone Powietrze","Mówisz Mi","Złote Godziny","Na Głośnik","Miasto Świateł","Nie Śpię","Daleko Stąd"]},
 {a:39,b:68,w:150,t:["Dzielnia '97","Kaseta","Słowa na Bruku","Stara Szkoła","Mikrofon i Ja","Szara Ulica","Rymy z Podwórka","Bit z Winyla","Prawdziwa Historia","Klatka Schodowa","Pierwsza Zwrotka","Wersy pod Wiatą"]},
 {a:48,b:48,w:72, t:["Droga 66","Elektryczny Wiatr","Kamienny Most","Ostatni Koncert","Stary Wzmacniacz","Dym nad Jeziorem","Burza w Lipcu","Skórzana Kurtka","Riff o Świcie","Autostrada Nocą","Ogień w Garażu","Długie Włosy","Ballada o Drodze"]},
 {a:62,b:12,w:3,  t:["Sonata Jesienna","Nokturn e-moll","Preludium Deszczowe","Kwartet G-dur","Etiuda Wiosenna","Adagio dla Smyczków","Mazurek op. 3","Fuga na Organy","Serenada Wieczorna","Koncert Fletowy","Suita Leśna","Wariacje na Temat"]},
 {a:67,b:30,w:52, t:["Walc dla Babci","Wspomnienie z Sopotu","Dancing w Grand Hotelu","Kapelusz i Parasol","Tango Pożegnalne","Noc nad Wisłą","Jesienne Liście","Stara Fotografia","Bossa w Kawiarni","Czekam na Ciebie","Pierwszy Taniec","Światła Portu"]},
];
let songs=[]; let sid=1;
{ const r=mulberry32(20261007);
  GEN.forEach(g=>g.t.forEach(title=>songs.push({id:sid++,title,
    age:clamp(Math.round(g.a+gauss(r)*2.4),5,80),
    bass:clamp(Math.round(g.b+gauss(r)*4.5),0,100),
    wpm:clamp(Math.round(g.w+gauss(r)*(g.w<10?2.5:8.5)),0,200)}))); }

const songById=id=>songs.find(s=>s.id===id);

/* ---------- modele DBSCAN ---------- */
const models={}; let letterIdx=0;
function makeModel(eps,minPts){
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ'[letterIdx%26]+(letterIdx>=26?Math.floor(letterIdx/26):'');
  letterIdx++;
  const id='m'+L;
  models[id]={id,letter:L,eps,minPts,seed:4100+letterIdx*977,resets:0,status:'untrained',
    clusters:[],noise:0,cores:[],labels:null,n:0};
  return id;
}
let lib=[makeModel(0.10,4),makeModel(0.04,4),makeModel(0.20,4)];
const slots={train:null,infer:null};
let newEps=0.08,newMin=4;

/* ---------- stan ---------- */
const T={rows:[],run:null,running:false,timer:null,msg:'',last:null};
const I={input:{id:null,title:'Mój utwór',age:22,bass:88,wpm:150},loaded:false,result:null,pred:null};
const selected=new Set();
const ui={edges:true,eps:false};

/* ---------- motyw do canvas ---------- */
let TH={};
function readTheme(){
  const cs=getComputedStyle(document.documentElement);
  const g=n=>cs.getPropertyValue(n).trim();
  TH={ink:g('--ink'),muted:g('--muted'),line:g('--line'),panel:g('--panel'),stroke:g('--glyph-stroke'),c:[1,2,3,4,5,6,7,8].map(n=>g('--c'+n))};
}
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readTheme,30));
new MutationObserver(()=>setTimeout(readTheme,30)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});

function drawShape(ctx,i,x,y,r,fill,stroke,lw){
  const p=SHAPE_P2D[i%NS]; ctx.save(); ctx.translate(x,y); ctx.scale(r,r);
  ctx.fillStyle=fill; ctx.fill(p);
  if(stroke){ctx.lineWidth=lw/r;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.stroke(p)}
  ctx.restore();
}

/* ---------- wykres 3D ---------- */
const VIEWS={'3d':[-0.68,0.40,0.32],'age-wpm':[0,0,0],'age-bass':[0,-Math.PI/2,0],'bass-wpm':[-Math.PI/2,0,0]};
const MONO="'JetBrains Mono', ui-monospace, Menlo, monospace";
class Scatter{
  constructor(cv){
    this.cv=cv;this.ctx=cv.getContext('2d');
    [this.yaw,this.pitch,this.persp]=VIEWS['3d'];[this.tYaw,this.tPitch,this.tPersp]=VIEWS['3d'];
    this.auto=false;this.dragging=false;this.onFree=null;
    new ResizeObserver(()=>this.resize()).observe(cv.parentElement);this.resize();
    cv.addEventListener('pointerdown',e=>{this.dragging=true;this.lx=e.clientX;this.ly=e.clientY;cv.setPointerCapture(e.pointerId);this.tPersp=0.32;this.onFree&&this.onFree();});
    cv.addEventListener('pointermove',e=>{if(!this.dragging)return;const dx=e.clientX-this.lx,dy=e.clientY-this.ly;this.lx=e.clientX;this.ly=e.clientY;
      this.tYaw+=dx*0.01;this.tPitch=clamp(this.tPitch+dy*0.01,-1.5708,1.5708);this.yaw=this.tYaw;this.pitch=this.tPitch;});
    const up=()=>{this.dragging=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  }
  setView(n){const v=VIEWS[n];this.tYaw=v[0];this.tPitch=v[1];this.tPersp=v[2];
    const tw=2*Math.PI; while(this.yaw-this.tYaw>Math.PI)this.yaw-=tw; while(this.tYaw-this.yaw>Math.PI)this.yaw+=tw;}
  resize(){const p=this.cv.parentElement;const w=p.clientWidth,h=p.clientHeight;this.dpr=window.devicePixelRatio||1;
    this.cv.width=Math.max(1,Math.round(w*this.dpr));this.cv.height=Math.max(1,Math.round(h*this.dpr));this.cv.style.width=w+'px';this.cv.style.height=h+'px';this.w=w;this.h=h;}
  proj(a,y,z){ // a=wiek, y=sł/min, z=bas (0..1)
    const x=a-.5,yy=y-.5,zz=z-.5;
    const cy=Math.cos(this.yaw),sy=Math.sin(this.yaw);
    const x1=x*cy-zz*sy,z1=x*sy+zz*cy;
    const cp=Math.cos(this.pitch),sp=Math.sin(this.pitch);
    const y2=yy*cp-z1*sp,z2=yy*sp+z1*cp;
    const f=1/(1+z2*this.persp);
    const S=Math.min(this.w*0.9,this.h*1.02)*0.62;this.S=S;
    return [this.w/2+x1*S*f,this.h/2-y2*S*f-6,z2,f];
  }
  fv(v){return this.proj(v[0],v[2],v[1])}
  draw(sc){
    const ctx=this.ctx,w=this.w,h=this.h;if(!w||!h)return;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);ctx.clearRect(0,0,w,h);
    if(this.auto&&!this.dragging)this.tYaw+=0.0045;
    const k=REDUCED?1:0.14;const Z=clamp(Math.min(w,h)/360,0.6,1);
    this.yaw+=(this.tYaw-this.yaw)*k;this.pitch+=(this.tPitch-this.pitch)*k;this.persp+=(this.tPersp-this.persp)*k;
    const L=(p,q)=>{ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1])};
    // sześcian
    ctx.lineWidth=1;ctx.strokeStyle=TH.line;ctx.beginPath();
    for(const a of [0,1])for(const b of [0,1]){L(this.proj(0,a,b),this.proj(1,a,b));L(this.proj(a,0,b),this.proj(a,1,b));L(this.proj(a,b,0),this.proj(a,b,1));}
    ctx.stroke();
    // osie
    const c0=this.proj(.5,.5,.5);
    const AX=[{d:[1,0,0],lab:'wiek',ticks:[0,20,40,60,80],max:80},{d:[0,1,0],lab:'sł/min',ticks:[0,50,100,150,200],max:200},{d:[0,0,1],lab:'bas',ticks:[0,25,50,75,100],max:100}];
    ctx.font=`500 10px ${MONO}`;ctx.textAlign='center';ctx.textBaseline='middle';
    for(const ax of AX){
      const p0=this.proj(0,0,0),p1=this.proj(...ax.d);
      if(Math.hypot(p1[0]-p0[0],p1[1]-p0[1])<30)continue;
      ctx.strokeStyle=TH.muted;ctx.lineWidth=1.4;ctx.beginPath();L(p0,p1);ctx.stroke();
      ctx.fillStyle=TH.muted;
      for(const t of (w<300?[ax.ticks[0],ax.ticks[ax.ticks.length-1]]:ax.ticks)){const u=t/ax.max;const q=this.proj(ax.d[0]*u,ax.d[1]*u,ax.d[2]*u);
        let ox=q[0]-c0[0],oy=q[1]-c0[1];const l=Math.hypot(ox,oy)||1;ox/=l;oy/=l;
        ctx.fillText(String(t),q[0]+ox*13,q[1]+oy*11);}
      const e=this.proj(ax.d[0]*1.16,ax.d[1]*1.16,ax.d[2]*1.16);
      ctx.font=`700 11px ${MONO}`;ctx.fillStyle=TH.ink;ctx.fillText(ax.lab,e[0],e[1]);ctx.font=`500 10px ${MONO}`;
    }
    const P=sc.pts.map(p=>({...p,q:this.fv(p.v)}));
    const epsR=f=>sc.eps*this.S*f;
    // otoczenia ε wszystkich punktów rdzeniowych
    if(sc.epsAll&&sc.eps){
      for(const p of P){if(p.k!=='core')continue;const col=TH.c[p.c%8];
        ctx.globalAlpha=0.07;ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.q[0],p.q[1],epsR(p.q[3]),0,6.3);ctx.fill();
        ctx.globalAlpha=0.35;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.stroke();}
      ctx.globalAlpha=1;
    }
    // połączenia (gęstościowa osiągalność)
    if(sc.edges&&sc.edges.length){ctx.lineWidth=1.5;ctx.globalAlpha=0.6;
      for(const [a,b,c] of sc.edges){const pa=this.fv(a),pb=this.fv(b);ctx.strokeStyle=TH.c[c%8];ctx.beginPath();L(pa,pb);ctx.stroke()}
      ctx.globalAlpha=1;}
    // aktualnie badany punkt: ε-kula (rzutuje się na koło)
    let FQ=null;
    if(sc.focus&&sc.eps){FQ=this.fv(sc.focus.v);const r=epsR(FQ[3]);
      ctx.fillStyle=TH.ink;ctx.globalAlpha=0.08;ctx.beginPath();ctx.arc(FQ[0],FQ[1],r,0,6.3);ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle=TH.ink;ctx.lineWidth=1.6;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
      ctx.lineWidth=1;ctx.globalAlpha=0.55;ctx.beginPath();for(const n of sc.focus.nbrs){L(FQ,this.fv(n))}ctx.stroke();ctx.globalAlpha=1;
      // etykieta ε
      ctx.font=`700 ${Math.round(11*Z)}px ${MONO}`;ctx.fillStyle=TH.ink;ctx.fillText('ε',FQ[0]+r*0.72+6,FQ[1]-r*0.72-4);
    }
    // wejście inferencji: ε-koło + linia do najbliższego rdzenia
    let IQ=null;
    if(sc.input){IQ=this.fv(sc.input.v);
      if(sc.eps){const r=epsR(IQ[3]);ctx.fillStyle=TH.ink;ctx.globalAlpha=0.07;ctx.beginPath();ctx.arc(IQ[0],IQ[1],r,0,6.3);ctx.fill();ctx.globalAlpha=1;
        ctx.strokeStyle=TH.ink;ctx.lineWidth=1.4;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);}
      if(sc.input.target){const t=this.fv(sc.input.target);ctx.strokeStyle=sc.input.inside?TH.ink:TH.muted;ctx.lineWidth=sc.input.inside?2.4:1.6;
        if(!sc.input.inside)ctx.setLineDash([2,4]);ctx.beginPath();L(IQ,t);ctx.stroke();ctx.setLineDash([])}
    }
    // punkty (od najdalszych)
    P.sort((a,b)=>b.q[2]-a.q[2]);
    for(const p of P){const [x,y,,f]=p.q;const fz=f*Z;
      ctx.globalAlpha=(sc.dim&&!p.hi)?0.38:1;
      if(p.k==='ghost'){ctx.globalAlpha=0.3;ctx.fillStyle=TH.muted;ctx.beginPath();ctx.arc(x,y,1.9*f,0,6.3);ctx.fill()}
      else if(p.k==='unv'){ctx.strokeStyle=TH.ink;ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,3.4*fz,0,6.3);ctx.stroke()}
      else if(p.k==='noise'){const r=4*fz;ctx.strokeStyle=TH.muted;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.moveTo(x-r*.7,y+r*.7);ctx.lineTo(x+r*.7,y-r*.7);ctx.stroke()}
      else if(p.k==='core'){drawShape(ctx,p.c,x,y,(p.hi?6.2:5)*fz,TH.c[p.c%8],p.hi?TH.ink:TH.stroke,p.hi?1.6:1)}
      else if(p.k==='border'){const r=4.8*fz;drawShape(ctx,p.c,x,y,r,TH.c[p.c%8],TH.stroke,1);drawShape(ctx,p.c,x,y,r*0.45,TH.panel,null,0)}
    }
    ctx.globalAlpha=1;
    if(FQ){ctx.strokeStyle=TH.ink;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(FQ[0],FQ[1],9*Z,0,6.3);ctx.stroke()}
    if(IQ){const [x,y]=IQ;
      ctx.fillStyle=TH.panel;ctx.beginPath();ctx.arc(x,y,12*Z,0,6.3);ctx.fill();
      ctx.strokeStyle=TH.ink;ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(x,y,9*Z,0,6.3);ctx.stroke();
      ctx.fillStyle=TH.ink;ctx.beginPath();ctx.arc(x,y,3.6*Z,0,6.3);ctx.fill();
      if(!REDUCED){const t=(performance.now()%1500)/1500;ctx.globalAlpha=1-t;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,(9+t*16)*Z,0,6.3);ctx.stroke();ctx.globalAlpha=1}
    }
  }
}

function labelOf(id){
  const R=T.run;
  if(R){return R.label.has(id)?{c:R.label.get(id),core:R.core.has(id),parent:R.parent.get(id)}:null}
  const m=models[slots.train];
  return m&&m.labels?(m.labels.get(id)||null):null;
}
function trainScene(){
  const m=models[slots.train];const inT=new Set(T.rows);const V=new Map();
  const vec=id=>{let v=V.get(id);if(!v){v=norm(songById(id));V.set(id,v)}return v};
  const edges=[];
  const pts=songs.map(s=>{const v=vec(s.id);
    if(!inT.has(s.id))return{v,k:'ghost'};
    const L=labelOf(s.id);
    if(!L)return{v,k:'unv'};
    if(L.c<0)return{v,k:'noise'};
    if(L.parent!=null&&inT.has(L.parent)&&songById(L.parent)){const pl=labelOf(L.parent);if(pl&&pl.c===L.c)edges.push([vec(L.parent),v,L.c])}
    return{v,k:L.core?'core':'border',c:L.c};});
  const R=T.run;
  const focus=R&&R.focus&&!R.done&&songById(R.focus.id)?{v:vec(R.focus.id),nbrs:R.focus.nbrs.filter(id=>id!==R.focus.id&&songById(id)).map(vec)}:null;
  return{pts,edges:ui.edges?edges:null,focus,eps:m?m.eps:null,epsAll:ui.eps};
}
function resultScene(){
  const m=models[slots.infer];const R=I.result;
  const hi=new Set(R&&R.sim?R.sim.map(o=>o.s.id):[]);
  const pred=I.pred&&m&&I.pred.key===m.id+':'+m.resets+':'+m.status?I.pred.map:null;
  const pts=songs.map(s=>{const v=norm(s);if(!pred)return{v,k:'ghost'};const p=pred.get(s.id);
    return p&&p.c>=0?{v,k:'core',c:p.c,hi:hi.has(s.id)}:{v,k:'noise'}});
  let input=null;
  if(I.loaded){input={v:norm(I.input)};if(R&&R.core){input.target=R.core.v;input.inside=R.c>=0}}
  return{pts,eps:m&&m.status!=='untrained'?m.eps:null,dim:true,input,epsAll:false,edges:null};
}

/* ---------- DBSCAN krok po kroku ---------- */
function newRun(m){
  let order=T.rows.filter(id=>songById(id));
  if($('#sOrder').value==='random'){const r=mulberry32(m.seed+m.resets*7919+order.length);for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
  const vec=new Map(order.map(id=>[id,norm(songById(id))]));
  T.run={order,pos:0,vec,label:new Map(),core:new Set(),visited:new Set(),queue:[],qset:new Set(),parent:new Map(),cur:-1,nC:0,focus:null,done:false};
  T.last=null;
}
function regionQuery(R,id,eps){const v=R.vec.get(id);const out=[];for(const [j,u] of R.vec){if(dist(v,u)<=eps)out.push(j)}return out}
function enqueue(R,ids,from){for(const j of ids){const l=R.label.get(j);if((l===undefined||l===-1)&&!R.qset.has(j)){R.queue.push(j);R.qset.add(j);if(!R.parent.has(j)||l===-1)R.parent.set(j,from)}}}
function stepTrain(){
  const m=models[slots.train];
  if(!m){nudge('#slotTrain');T.msg='brak modelu';return false}
  if(!T.rows.length){nudge('#cTrainData');T.msg='brak danych';return false}
  if(!T.run)newRun(m);
  const R=T.run;
  if(R.done){T.msg='gotowe';return false}
  m.status='training';
  if(!R.queue.length){
    while(R.pos<R.order.length&&R.visited.has(R.order[R.pos]))R.pos++;
    const id=R.order[R.pos];R.visited.add(id);
    const N=regionQuery(R,id,m.eps);R.focus={id,nbrs:N};T.last='pick';
    if(N.length>=m.minPts){const c=R.nC++;R.cur=c;R.label.set(id,c);R.core.add(id);enqueue(R,N.filter(j=>j!==id),id);T.msg=`rdzeń · |N|=${N.length} → klaster ${c+1}`}
    else{R.label.set(id,-1);T.msg=`|N|=${N.length} < ${m.minPts} → szum`}
  }else{
    const id=R.queue.shift();R.qset.delete(id);const c=R.cur;T.last='expand';
    if(R.label.get(id)===-1){R.label.set(id,c);R.focus={id,nbrs:[]};T.msg=`szum → brzeg klastra ${c+1}`}
    else{
      R.visited.add(id);R.label.set(id,c);
      const N=regionQuery(R,id,m.eps);R.focus={id,nbrs:N};
      if(N.length>=m.minPts){R.core.add(id);enqueue(R,N.filter(j=>j!==id),id);T.msg=`rdzeń · |N|=${N.length}`}
      else T.msg=`brzeg · |N|=${N.length}`;
    }
  }
  // koniec?
  if(!R.queue.length){let p=R.pos;while(p<R.order.length&&R.visited.has(R.order[p]))p++;
    if(p>=R.order.length){R.done=true;R.focus=null;T.last='done';m.status='trained';T.msg=''}}
  saveModel(m,R);
  return true;
}
function saveModel(m,R){
  const cl=[];for(let c=0;c<R.nC;c++)cl.push({n:0,cores:0,sum:[0,0,0]});
  let noise=0;const labels=new Map();const cores=[];
  for(const [id,c] of R.label){const core=R.core.has(id);labels.set(id,{c,core,parent:R.parent.get(id)});
    if(c<0){noise++;continue}const v=R.vec.get(id);const o=cl[c];o.n++;if(core){o.cores++;cores.push({v,c,id})}
    const s=songById(id);o.sum[0]+=s.age;o.sum[1]+=s.bass;o.sum[2]+=s.wpm;}
  m.clusters=cl.map(o=>({n:o.n,cores:o.cores,mean:o.sum.map(x=>o.n?x/o.n:0)}));
  m.noise=noise;m.cores=cores;m.labels=labels;m.n=R.order.length;m.visited=R.visited.size;
}
function resetModel(){
  const m=models[slots.train];if(!m){nudge('#slotTrain');return}
  stopRun();Object.assign(m,{status:'untrained',clusters:[],noise:0,cores:[],labels:null,n:0});m.resets++;
  T.run=null;T.last=null;T.msg='';renderAll();
}
const SPEEDS=[900,600,400,260,170,110,70,45,25,12];
function delay(){return SPEEDS[+$('#rSpeed').value-1]}
function tick(){
  if(!T.running)return;
  const ok=stepTrain();renderAfterStep();
  if(!ok||(T.run&&T.run.done)){stopRun();return}
  T.timer=setTimeout(tick,delay());
}
function startRun(){if(T.running)return;if(!models[slots.train]){nudge('#slotTrain');return}
  if(T.run&&T.run.done)T.run=null;
  T.running=true;renderControls();tick()}
function stopRun(){T.running=false;clearTimeout(T.timer);renderControls()}
function finish(){stopRun();const m=models[slots.train];if(!m){nudge('#slotTrain');return}
  if(T.run&&T.run.done)T.run=null;
  let guard=0;while(stepTrain()&&!(T.run&&T.run.done)&&guard++<20000);renderAfterStep()}

/* ---------- inferencja ---------- */
function predict(v,m){let best=null,bd=Infinity;for(const p of m.cores){const d=dist(v,p.v);if(d<bd){bd=d;best=p}}
  return best?{c:bd<=m.eps?best.c:-1,d:bd,core:best}:{c:-1,d:Infinity,core:null}}
function infer(pulse=true){
  const m=models[slots.infer];I.pred=null;
  if(m&&m.status!=='untrained'&&m.cores.length){const map=new Map();songs.forEach(s=>map.set(s.id,predict(norm(s),m)));I.pred={key:m.id+':'+m.resets+':'+m.status,map}}
  if(!I.loaded){I.result=null}
  else if(!m){I.result={err:'brak modelu'}}
  else if(m.status==='untrained'||!m.cores.length){I.result={err:m.status==='untrained'?'model nieuczony':'model bez klastrów',m}}
  else{
    const v=norm(I.input);const p=predict(v,m);
    const per=m.clusters.map((_,c)=>{let bd=Infinity;for(const q of m.cores)if(q.c===c){const d=dist(v,q.v);if(d<bd)bd=d}return bd});
    let sim=[];
    if(p.c>=0)sim=songs.filter(s=>s.id!==I.input.id).map(s=>({s,pr:I.pred.map.get(s.id),d:dist(norm(s),v)}))
      .filter(o=>o.pr.c===p.c).sort((a,b)=>a.d-b.d).slice(0,6);
    I.result={m,c:p.c,d:p.d,core:p.core,per,sim};
  }
  renderInfer();
  if(pulse&&I.loaded){const pg=$('#cInferProg');pg.classList.remove('pulse');void pg.offsetWidth;pg.classList.add('pulse');
    flash('#flowIn');setTimeout(()=>flash('#flowOut'),250);}
}

    fs.appendChild(d);
    const set=v=>{I.input[f.key]=clamp(Math.round(+v||0),f.min,f.max);I.input.id=null;syncFields();renderToken();if(I.loaded)infer(false)};
    d.querySelector('.num').addEventListener('change',e=>set(e.target.value));
    d.querySelector('input[type=range]').addEventListener('input',e=>set(e.target.value));
  });
  $('#inTitle').addEventListener('input',e=>{I.input.title=e.target.value;renderToken();if(I.loaded)renderInfer()});
})();
function syncFields(){
  $('#inTitle').value=I.input.title;
  FEAT.forEach(f=>{$('#in-'+f.key).value=I.input[f.key];$('#rg-'+f.key).value=I.input[f.key]});
}

/* ---------- tabela: zdarzenia ---------- */
$('#tbody').addEventListener('change',e=>{
  const tr=e.target.closest('tr');if(!tr)return;const id=+tr.dataset.id;const s=songById(id);
  if(e.target.classList.contains('sel')){e.target.checked?selected.add(id):selected.delete(id);updateTableMarks();return}
  if(e.target.classList.contains('num')){const f=FEAT.find(f=>f.key===e.target.dataset.k);s[f.key]=clamp(Math.round(+e.target.value||0),f.min,f.max);e.target.value=s[f.key];
    if(T.rows.includes(id))rowsChanged();if(I.loaded)infer(false)}
});
$('#tbody').addEventListener('dblclick',e=>{
  const td=e.target.closest('td.tt');if(!td)return;const id=+td.parentElement.dataset.id;const s=songById(id);
  td.innerHTML=`<input value="${esc(s.title)}" maxlength="40" aria-label="Tytuł">`;const inp=td.firstChild;inp.focus();inp.select();
  const done=()=>{s.title=inp.value.trim()||s.title;td.textContent=s.title;td.title=s.title;renderTrainData();if(I.loaded)renderInfer()};
  inp.addEventListener('blur',done,{once:true});inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur()});
});
$('#selAll').addEventListener('change',e=>{selected.clear();if(e.target.checked)songs.forEach(s=>selected.add(s.id));rowEls.forEach(tr=>tr.querySelector('.sel').checked=e.target.checked);updateTableMarks()});
$('#addRow').addEventListener('click',()=>{
  const s={id:sid++,title:'Nowy utwór '+(songs.length-99),age:30,bass:50,wpm:100};songs.push(s);renderTable();
  const tr=rowEls.get(s.id);tr.scrollIntoView({block:'nearest'});tr.querySelector('.num').focus();
});
$('#tdBody').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b)removeRow(+b.dataset.rm)});

/* ---------- kontrolki ---------- */
$('#bStep').addEventListener('click',()=>{stopRun();if(T.run&&T.run.done)T.run=null;stepTrain();renderAfterStep()});
$('#bRun').addEventListener('click',()=>T.running?stopRun():startRun());
$('#bFinish').addEventListener('click',finish);
$('#bReset').addEventListener('click',resetModel);
$('#sOrder').addEventListener('change',()=>{if(T.run&&!T.run.done){stopRun();T.run=null;T.last=null;renderAfterStep()}});
$('#rSpeed').addEventListener('input',renderControls);
$('#bAll').addEventListener('click',()=>addRows(songs.map(s=>s.id)));
$('#bSel').addEventListener('click',()=>{if(!selected.size){nudge('#cData');return}addRows(songs.filter(s=>selected.has(s.id)).map(s=>s.id))});
$('#bClear').addEventListener('click',clearRows);
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  scatter.auto=scatter2.auto=false;$('#tRot').setAttribute('aria-pressed','false');scatter.setView(b.dataset.view);scatter2.setView(b.dataset.view)}));
const tog=(id,fn)=>$(id).addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));fn(on)});
tog('#tRot',on=>{scatter.auto=scatter2.auto=on;if(on){scatter.tPersp=scatter2.tPersp=0.32;scatter.onFree()}});
tog('#tEdges',on=>ui.edges=on);
tog('#tEps',on=>ui.eps=on);
$('#bInfer').addEventListener('click',()=>{if(!slots.infer)nudge('#slotInfer');loadInput()});
$('#bRand').addEventListener('click',()=>{const r=Math.random;I.input={id:null,title:'Losowy utwór',age:Math.round(8+r()*62),bass:Math.round(5+r()*92),wpm:Math.round(r()*180)};syncFields();renderToken();if(I.loaded)infer(true)});
$('#eMinus').addEventListener('click',()=>{newEps=Math.max(0.02,+(newEps-0.02).toFixed(2));renderLibrary()});
$('#ePlus').addEventListener('click',()=>{newEps=Math.min(0.40,+(newEps+0.02).toFixed(2));renderLibrary()});
$('#mMinus').addEventListener('click',()=>{newMin=Math.max(2,newMin-1);renderLibrary()});
$('#mPlus').addEventListener('click',()=>{newMin=Math.min(15,newMin+1);renderLibrary()});
$('#addModel').addEventListener('click',()=>{lib.push(makeModel(newEps,newMin));renderLibrary();const l=$('#libList');l.scrollTop=l.scrollHeight;land(l.lastElementChild)});
$('#libList').addEventListener('dblclick',e=>{const c=e.target.closest('.mcard');if(!c)return;const to=!slots.train?'train':!slots.infer?'infer':null;if(to)moveModel(c.dataset.model,'lib',to)});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.code==='Space'){e.preventDefault();stopRun();if(T.run&&T.run.done)T.run=null;stepTrain();renderAfterStep()}
});

/* ---------- przeciąganie ---------- */
let DR=null;
document.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const src=e.target.closest('[data-drag]');if(!src)return;
  if(e.target.closest('input,button,select,textarea,label,a'))return;
  const r=src.getBoundingClientRect();
  DR={src,type:src.dataset.drag,x0:e.clientX,y0:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,started:false,over:null};
  if(DR.type!=='rows'||src.tagName==='TH')e.preventDefault();
});
function payloadRows(src){
  if(src.dataset.all)return songs.map(s=>s.id);
  const id=+src.dataset.id;
  if(selected.has(id)&&selected.size>1)return songs.filter(s=>selected.has(s.id)).map(s=>s.id);
  return [id];
}
function startDrag(){
  const d=DR;d.started=true;document.body.classList.add('is-dragging');
  try{getSelection().removeAllRanges()}catch(_){}
  let g;
  if(d.type==='model'){
    d.id=d.src.dataset.model;d.from=d.src.closest('[data-loc]').dataset.loc;
    g=d.src.cloneNode(true);g.style.width=Math.min(Math.max(d.w,220),300)+'px';d.src.classList.add('lifted');
  }else if(d.type==='rows'){
    d.ids=payloadRows(d.src);g=document.createElement('div');
    const n=d.ids.length;g.className='rowghost'+(n===1?' one':'');
    g.innerHTML=n===1?`<span>⠿</span><span>${esc(songById(d.ids[0]).title)}</span>`:`<b>${n}</b><span>${plural(n)}</span>`;
    d.ox=18;d.oy=18;
  }else{
    g=d.src.cloneNode(true);g.removeAttribute('id');g.style.width=d.w+'px';d.src.classList.add('lifted');
  }
  g.classList.add('ghost');g.removeAttribute('data-drag');document.body.appendChild(g);d.ghost=g;
  document.querySelectorAll('[data-accept]').forEach(el=>{if(el.dataset.accept.split(' ').includes(d.type))el.classList.add('can-drop')});
}
function findTarget(x,y){
  let el=document.elementFromPoint(x,y);
  while(el&&el!==document.body){if(el.dataset&&el.dataset.accept&&el.dataset.accept.split(' ').includes(DR.type))return el;el=el.parentElement}
  return null;
}
document.addEventListener('pointermove',e=>{
  if(!DR)return;
  if(!DR.started){if(Math.hypot(e.clientX-DR.x0,e.clientY-DR.y0)<6)return;startDrag()}
  e.preventDefault();
  const rot=DR.type==='model'?-2.5:-1.5;
  DR.ghost.style.transform=`translate(${e.clientX-DR.ox}px,${e.clientY-DR.oy}px) rotate(${rot}deg)`;
  const t=findTarget(e.clientX,e.clientY);
  if(t!==DR.over){DR.over&&DR.over.classList.remove('over');t&&t.classList.add('over');DR.over=t}
},{passive:false});
function endDrag(){
  document.body.classList.remove('is-dragging');
  DR.ghost&&DR.ghost.remove();DR.src.classList.remove('lifted');
  document.querySelectorAll('.can-drop,.over').forEach(el=>el.classList.remove('can-drop','over'));
}
document.addEventListener('pointerup',e=>{
  if(!DR)return;const d=DR;
  if(d.started){const t=findTarget(e.clientX,e.clientY);endDrag();DR=null;if(t)doDrop(d,t);return}
  DR=null;
});
document.addEventListener('pointercancel',()=>{if(DR&&DR.started)endDrag();DR=null});
function doDrop(d,t){
  const kind=t.dataset.drop;
  if(d.type==='model'){
    let to=t.dataset.slot;if(kind==='trainprog')to='train';if(kind==='inferprog')to='infer';
    moveModel(d.id,d.from,to);
    land(to==='train'?$('#slotTrain'):to==='infer'?$('#slotInfer'):$('#libList'));
    return;
  }
  if(d.type==='rows'){
    if(kind==='traindata'||kind==='trainprog'){addRows(d.ids);land($('#cTrainData'))}
    else if(kind==='inferinput'){fillInput(d.ids[0]);land($('#cInput'))}
    else if(kind==='inferprog'){fillInput(d.ids[0]);loadInput()}
    return;
  }
  if(d.type==='input'&&kind==='inferprog'){loadInput()}
}

/* ---------- start ---------- */
syncFields();renderTable();renderAll();
})();
</script>
